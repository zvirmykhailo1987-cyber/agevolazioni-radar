    side: datore
    aliases: [zfu-sisma-centro-italia-2025, zfu-sisma-centro-italia-2026]
  - id: sgravio-contratti-solidarieta
    name: Sgravio per i contratti di solidarietà
    group: lavoratori
    side: datore
