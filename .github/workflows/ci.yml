name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -c requirements.lock -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Types
        run: mypy
      - name: "Tests (offline: fake INPS, fake LLM, real dlt + dbt in a temp DuckDB)"
        run: pytest --cov --cov-report=term-missing
      - name: dbt parse
        run: dbt parse --project-dir dbt --profiles-dir dbt
      - name: Security
        run: |
          bandit -q -r src -s B104
          pip-audit --skip-editable
      - name: Mutation check (every injected bug must break a test)
        run: python scripts/mutation_check.py
